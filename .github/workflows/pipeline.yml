name: Data Pipeline

on: [push]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t rfm-pipeline .

      - name: Run Pipeline
        run: |
          # Use set -x to debug execution
          set -x
          docker run --rm -v ${{ github.workspace }}:/app rfm-pipeline